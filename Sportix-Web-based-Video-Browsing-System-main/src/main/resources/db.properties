# =============================================================================
# Sportix database connection (read by lk.sportix.util.DBConnection)
# Change db.username / db.password to match YOUR local MySQL Workbench login.
# Run database/sportix_schema.sql in MySQL Workbench first to create sportix_db.
# =============================================================================
db.driver=com.mysql.cj.jdbc.Driver
# connectionTimeZone=LOCAL: MySQL and Tomcat run on the same PC, so times are shown exactly as stored
# (the old serverTimezone=UTC shifted every displayed time by +5:30 in Sri Lanka).
db.url=jdbc:mysql://localhost:3306/sportix_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionTimeZone=LOCAL
db.username=root
db.password=root
